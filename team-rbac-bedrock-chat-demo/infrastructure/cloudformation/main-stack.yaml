AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Team-Based RBAC LLM Gateway - Direct Bedrock API with team-based access control.

  Deploys:
  - REST API Gateway with API keys and usage plans per team
  - Lambda proxy function (routes requests to Bedrock with team-based model governance)
  - IAM roles scoped per team (Team Alpha: Haiku+Sonnet, Team Beta: Haiku only)
  - CloudWatch log group with configurable retention

  After deployment:
  1. Get API key values from Outputs
  2. Update chatbox.html with the API endpoint and keys
  3. Open chatbox.html in a browser to test team-based access control

Parameters:
  S3ArtifactBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment packages

  ProxyCodeKey:
    Type: String
    Default: lambda/gateway-proxy.zip
    Description: S3 key for Lambda proxy code zip

  EnableGuardrail:
    Type: String
    Default: 'false'
    Description: Enable Bedrock Guardrail for content filtering
    AllowedValues:
      - 'true'
      - 'false'

  GuardrailId:
    Type: String
    Default: ''
    Description: (Optional) Bedrock Guardrail ID - required if EnableGuardrail is true

  TeamAlphaRateLimit:
    Type: Number
    Default: 50
    Description: API requests per second for Team Alpha

  TeamBetaRateLimit:
    Type: Number
    Default: 20
    Description: API requests per second for Team Beta

  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
    Description: CloudWatch Logs retention period

Conditions:
  UseGuardrail: !Not [!Equals [!Ref GuardrailId, '']]

Resources:
  # ============================================================
  # CloudWatch Log Group
  # ============================================================
  ProxyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-proxy'
      RetentionInDays: !Ref LogRetentionDays

  # ============================================================
  # IAM Roles
  # ============================================================
  LambdaProxyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-proxy-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ProxyLogGroup.Arn
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-5-haiku*'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-5-sonnet*'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-opus*'
                  - !Sub 'arn:aws:bedrock:us.*::foundation-model/anthropic.claude-3-5-haiku*'
                  - !Sub 'arn:aws:bedrock:us.*::foundation-model/anthropic.claude-3-5-sonnet*'
                  - !Sub 'arn:aws:bedrock:us.*::foundation-model/anthropic.claude-opus*'
        - !If
          - UseGuardrail
          - PolicyName: GuardrailAccess
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: bedrock:ApplyGuardrail
                  Resource: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${GuardrailId}'
          - !Ref AWS::NoValue

  # ============================================================
  # Lambda Function
  # ============================================================
  GatewayProxyFunction:
    Type: AWS::Lambda::Function
    DependsOn: ProxyLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-proxy'
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaProxyRole.Arn
      Timeout: 30
      MemorySize: 256
      Code:
        S3Bucket: !Ref S3ArtifactBucket
        S3Key: !Ref ProxyCodeKey
      Environment:
        Variables:
          TEAM_ALPHA_MODELS: haiku,sonnet
          TEAM_BETA_MODELS: haiku
          GUARDRAIL_ID: !If [UseGuardrail, !Ref GuardrailId, '']
          GUARDRAIL_VERSION: DRAFT

  # ============================================================
  # REST API Gateway with API Keys
  # ============================================================
  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      Description: Team-based LLM Gateway with API key authentication

  # /invoke resource
  InvokeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: invoke

  # POST /invoke method (requires API key)
  InvokeMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref InvokeResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GatewayProxyFunction.Arn}/invocations'

  # OPTIONS /invoke (CORS preflight - no API key required)
  InvokeOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref InvokeResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      ApiKeyRequired: false
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,x-api-key'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - InvokeMethod
      - InvokeOptionsMethod
    Properties:
      RestApiId: !Ref ApiGateway

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ApiGateway
      DeploymentId: !Ref ApiDeployment
      StageName: prod
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 100
          ThrottlingBurstLimit: 200

  # Lambda permission for API Gateway
  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GatewayProxyFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*'

  # ============================================================
  # API Keys and Usage Plans
  # ============================================================
  TeamAlphaApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: ApiStage
    Properties:
      Name: !Sub '${AWS::StackName}-team-alpha-key'
      Description: API key for Team Alpha (Haiku + Sonnet access)
      Enabled: true

  TeamBetaApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: ApiStage
    Properties:
      Name: !Sub '${AWS::StackName}-team-beta-key'
      Description: API key for Team Beta (Haiku only)
      Enabled: true

  TeamAlphaUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiStage
    Properties:
      UsagePlanName: !Sub '${AWS::StackName}-team-alpha-plan'
      Description: Usage plan for Team Alpha
      ApiStages:
        - ApiId: !Ref ApiGateway
          Stage: prod
      Throttle:
        RateLimit: !Ref TeamAlphaRateLimit
        BurstLimit: !Ref TeamAlphaRateLimit
      Quota:
        Limit: 10000
        Period: DAY

  TeamBetaUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiStage
    Properties:
      UsagePlanName: !Sub '${AWS::StackName}-team-beta-plan'
      Description: Usage plan for Team Beta
      ApiStages:
        - ApiId: !Ref ApiGateway
          Stage: prod
      Throttle:
        RateLimit: !Ref TeamBetaRateLimit
        BurstLimit: !Ref TeamBetaRateLimit
      Quota:
        Limit: 5000
        Period: DAY

  TeamAlphaUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref TeamAlphaApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref TeamAlphaUsagePlan

  TeamBetaUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref TeamBetaApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref TeamBetaUsagePlan

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL (use in chatbox.html)
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod/invoke'

  TeamAlphaApiKeyId:
    Description: 'Team Alpha API Key ID (get value with: aws apigateway get-api-key --api-key <ID> --include-value)'
    Value: !Ref TeamAlphaApiKey

  TeamBetaApiKeyId:
    Description: 'Team Beta API Key ID (get value with: aws apigateway get-api-key --api-key <ID> --include-value)'
    Value: !Ref TeamBetaApiKey

  ProxyFunctionArn:
    Description: Gateway proxy Lambda function ARN
    Value: !GetAtt GatewayProxyFunction.Arn

  ProxyLogGroup:
    Description: CloudWatch Log Group for auditing and cost tracking
    Value: !Ref ProxyLogGroup

  CloudWatchInsightsQuery:
    Description: Sample CloudWatch Insights query for cost tracking
    Value: !Sub |
      Log Group: /aws/lambda/${AWS::StackName}-proxy
      Query: fields @timestamp, team, model, status, input_tokens, output_tokens
             | filter status = 'success'
             | stats sum(input_tokens) as total_input, sum(output_tokens) as total_output by team
