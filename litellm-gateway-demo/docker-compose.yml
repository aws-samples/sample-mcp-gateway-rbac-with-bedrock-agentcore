# LiteLLM Gateway — Local Development
# Usage: docker compose up -d
# Admin UI: http://localhost:4000/ui
# API: http://localhost:4000/chat/completions

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    ports:
      - "4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml
      # Option B: mount host AWS config/credentials read-only.
      # The container reads the AWS_PROFILE below instead of hardcoded keys.
      - ${HOME}/.aws:/root/.aws:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-demo-master-key}
      - DATABASE_URL=postgresql://litellm:litellm@postgres:5432/litellm
      - REDIS_HOST=redis
      # Use a STATIC profile (no credential_process) that refresh-aws-creds.sh
      # populates from your real 'bedrock' profile on the host.
      # Pinned (not ${AWS_PROFILE}) so a host shell AWS_PROFILE can't leak in
      # and point the container at a credential_process it can't run.
      - AWS_PROFILE=bedrock-static
      - AWS_REGION=${AWS_REGION:-us-east-1}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health/liveliness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: litellm-db
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellm
      - POSTGRES_DB=litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: litellm-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
