AWSTemplateFormatVersion: '2010-09-09'
Description: |
  AWS Bedrock Governance Demos - Master Stack

  One-click deployment for both demos:
  - Demo #1: AgentCore Gateway with VS Code + Cedar RBAC
  - Demo #2: Browser Chat with Team-based Model Access

  This master stack orchestrates nested stacks for:
  - Shared resources (S3, logging, monitoring)
  - Demo #1 infrastructure (Lambda MCPs, IAM roles, MCP Registry)
  - Demo #2 infrastructure (API Gateway, Lambda proxy, WAF, guardrails)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Deployment Configuration"
        Parameters:
          - ProjectName
          - Environment
          - DeployDemo1
          - DeployDemo2
      - Label:
          default: "Demo #1 - AgentCore Gateway Configuration"
        Parameters:
          - Demo1MCPServersToInclude
          - Demo1EnableCedarPolicies
      - Label:
          default: "Demo #2 - Browser Chat Configuration"
        Parameters:
          - Demo2TeamAlphaRateLimit
          - Demo2TeamBetaRateLimit
          - Demo2EnableWAF
          - Demo2EnableGuardrails
      - Label:
          default: "Advanced Configuration"
        Parameters:
          - EnableCloudWatchDashboards
          - EnableXRayTracing
          - LambdaLogRetentionDays

Parameters:
  ProjectName:
    Type: String
    Default: bedrock-governance-demo
    Description: Project name prefix for all resources
    AllowedPattern: ^[a-z][a-z0-9-]*$
    ConstraintDescription: Must start with lowercase letter, contain only lowercase letters, numbers, and hyphens

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name (dev/staging/prod)

  DeployDemo1:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Deploy Demo #1 (AgentCore Gateway + VS Code integration)

  DeployDemo2:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Deploy Demo #2 (Browser Chat + Team RBAC)

  # Demo #1 Parameters
  Demo1MCPServersToInclude:
    Type: CommaDelimitedList
    Default: ecommerce,products,orders,jira
    Description: 'Comma-separated list of MCP servers to deploy: ecommerce,products,orders,jira'

  Demo1EnableCedarPolicies:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Deploy Cedar policy resources for AgentCore Gateway RBAC

  # Demo #2 Parameters
  Demo2TeamAlphaRateLimit:
    Type: Number
    Default: 50
    MinValue: 1
    MaxValue: 10000
    Description: API requests per second for Team Alpha

  Demo2TeamBetaRateLimit:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 10000
    Description: API requests per second for Team Beta

  Demo2EnableWAF:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable AWS WAF for API Gateway with prompt injection protection

  Demo2EnableGuardrails:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Deploy Bedrock Guardrails for content filtering

  # Advanced Parameters
  EnableCloudWatchDashboards:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Create CloudWatch dashboards for monitoring

  EnableXRayTracing:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable AWS X-Ray tracing for Lambda functions

  LambdaLogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
    Description: CloudWatch Logs retention period for Lambda functions

Conditions:
  ShouldDeployDemo1: !Equals [!Ref DeployDemo1, 'true']
  ShouldDeployDemo2: !Equals [!Ref DeployDemo2, 'true']
  ShouldCreateDashboards: !Equals [!Ref EnableCloudWatchDashboards, 'true']

Resources:
  # ============================================================
  # Shared Resources Stack
  # ============================================================
  SharedResourcesStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${ArtifactBucket}.s3.${AWS::Region}.amazonaws.com/cloudformation/nested-stacks/shared-resources.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        LogRetentionDays: !Ref LambdaLogRetentionDays
        EnableXRayTracing: !Ref EnableXRayTracing
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: Shared

  # ============================================================
  # Demo #1: AgentCore Gateway + MCPs
  # ============================================================
  Demo1Stack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldDeployDemo1
    DependsOn: SharedResourcesStack
    Properties:
      TemplateURL: !Sub 'https://${ArtifactBucket}.s3.${AWS::Region}.amazonaws.com/cloudformation/nested-stacks/demo1-agentcore-gateway.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        ArtifactBucket: !GetAtt SharedResourcesStack.Outputs.ArtifactBucketName
        MCPServersToInclude: !Join [',', !Ref Demo1MCPServersToInclude]
        EnableCedarPolicies: !Ref Demo1EnableCedarPolicies
        LogRetentionDays: !Ref LambdaLogRetentionDays
        EnableXRayTracing: !Ref EnableXRayTracing
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: Demo1-AgentCore

  # ============================================================
  # Demo #2: Browser Chat + Team RBAC
  # ============================================================
  Demo2Stack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldDeployDemo2
    DependsOn: SharedResourcesStack
    Properties:
      TemplateURL: !Sub 'https://${ArtifactBucket}.s3.${AWS::Region}.amazonaws.com/cloudformation/nested-stacks/demo2-browser-chat.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        ArtifactBucket: !GetAtt SharedResourcesStack.Outputs.ArtifactBucketName
        TeamAlphaRateLimit: !Ref Demo2TeamAlphaRateLimit
        TeamBetaRateLimit: !Ref Demo2TeamBetaRateLimit
        EnableWAF: !Ref Demo2EnableWAF
        EnableGuardrails: !Ref Demo2EnableGuardrails
        LogRetentionDays: !Ref LambdaLogRetentionDays
        EnableXRayTracing: !Ref EnableXRayTracing
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: Demo2-BrowserChat

  # ============================================================
  # Monitoring Dashboard (Optional)
  # ============================================================
  MonitoringStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldCreateDashboards
    DependsOn:
      - SharedResourcesStack
    Properties:
      TemplateURL: !Sub 'https://${ArtifactBucket}.s3.${AWS::Region}.amazonaws.com/cloudformation/nested-stacks/monitoring.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        Demo1Deployed: !Ref DeployDemo1
        Demo2Deployed: !Ref DeployDemo2
        Demo1StackName: !If [ShouldDeployDemo1, !GetAtt Demo1Stack.Outputs.StackName, 'NONE']
        Demo2StackName: !If [ShouldDeployDemo2, !GetAtt Demo2Stack.Outputs.StackName, 'NONE']
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: Monitoring

  # ============================================================
  # Artifact Bucket for CloudFormation Templates & Lambda Code
  # ============================================================
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-artifacts-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFormationRead
            Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub '${ArtifactBucket.Arn}/*'
          - Sid: AllowLambdaRead
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub '${ArtifactBucket.Arn}/lambda/*'

Outputs:
  # Shared Outputs
  ArtifactBucketName:
    Description: S3 bucket for Lambda code and CloudFormation templates
    Value: !Ref ArtifactBucket
    Export:
      Name: !Sub '${AWS::StackName}-ArtifactBucket'

  ArtifactBucketArn:
    Description: ARN of artifact bucket
    Value: !GetAtt ArtifactBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ArtifactBucketArn'

  SharedResourcesStackId:
    Description: Stack ID of shared resources
    Value: !Ref SharedResourcesStack

  # Demo #1 Outputs
  Demo1Deployed:
    Condition: ShouldDeployDemo1
    Description: Demo #1 deployment status
    Value: 'true'

  Demo1StackId:
    Condition: ShouldDeployDemo1
    Description: Stack ID of Demo #1 (AgentCore Gateway)
    Value: !Ref Demo1Stack

  Demo1RegistryUrl:
    Condition: ShouldDeployDemo1
    Description: MCP Registry URL for GitHub Copilot configuration
    Value: !GetAtt Demo1Stack.Outputs.RegistryUrl

  Demo1MCPServerCount:
    Condition: ShouldDeployDemo1
    Description: Number of MCP servers deployed
    Value: !GetAtt Demo1Stack.Outputs.MCPServerCount

  # Demo #2 Outputs
  Demo2Deployed:
    Condition: ShouldDeployDemo2
    Description: Demo #2 deployment status
    Value: 'true'

  Demo2StackId:
    Condition: ShouldDeployDemo2
    Description: Stack ID of Demo #2 (Browser Chat)
    Value: !Ref Demo2Stack

  Demo2ApiEndpoint:
    Condition: ShouldDeployDemo2
    Description: API Gateway endpoint for chatbox
    Value: !GetAtt Demo2Stack.Outputs.ApiEndpoint

  Demo2TeamAlphaApiKey:
    Condition: ShouldDeployDemo2
    Description: API key for Team Alpha (use in chatbox)
    Value: !GetAtt Demo2Stack.Outputs.TeamAlphaApiKey

  Demo2TeamBetaApiKey:
    Condition: ShouldDeployDemo2
    Description: API key for Team Beta (use in chatbox)
    Value: !GetAtt Demo2Stack.Outputs.TeamBetaApiKey

  # Monitoring
  MonitoringDashboardUrl:
    Condition: ShouldCreateDashboards
    Description: CloudWatch dashboard URL
    Value: !GetAtt MonitoringStack.Outputs.DashboardUrl

  # Quick Start Commands
  Demo1NextSteps:
    Condition: ShouldDeployDemo1
    Description: Next steps for Demo #1
    Value: !Sub |
      1. Deploy AgentCore Gateway: cd DemoMcpGateway/agentcore && agentcore deploy
      2. Configure VS Code: Update vscode-config/mcp.json with registry URL: ${Demo1Stack.Outputs.RegistryUrl}
      3. See DEMO.md for testing scenarios

  Demo2NextSteps:
    Condition: ShouldDeployDemo2
    Description: Next steps for Demo #2
    Value: !Sub |
      1. Update chatbox HTML with API endpoint: ${Demo2Stack.Outputs.ApiEndpoint}
      2. Use API keys - Team Alpha: (see output Demo2TeamAlphaApiKey), Team Beta: (see output Demo2TeamBetaApiKey)
      3. Open chatbox.html in browser to test
