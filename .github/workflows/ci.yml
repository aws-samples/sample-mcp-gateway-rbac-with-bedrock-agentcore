name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install flake8
        run: pip install flake8
      - name: Lint Demo 1 Lambda functions
        run: flake8 gateway-url-ide-integration-demo/lambda/ --max-line-length=120 --ignore=E501,W503
      - name: Lint Demo 2 Lambda functions
        run: flake8 team-rbac-bedrock-chat-demo/lambda/ --max-line-length=120 --ignore=E501,W503

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pytest boto3 moto
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded secrets
        run: |
          # Fail if any real AWS account IDs (12-digit numbers in ARNs) are found
          # Excludes the standard AWS docs placeholder 123456789012
          if grep -rn '[0-9]\{12\}' --include="*.json" --include="*.yaml" --include="*.yml" \
               --include="*.py" --include="*.sh" --include="*.ts" --include="*.js" \
               --include="*.cedar" . \
             | grep -v "123456789012" \
             | grep -v "017000801446" \
             | grep -v "/.git/" \
             | grep -v "/cdk.out/" \
             | grep -v "/node_modules/" \
             | grep -v "/.venv/" \
             | grep -v "package-lock.json"; then
            echo "ERROR: Possible hardcoded AWS account ID found. Replace with <ACCOUNT_ID> placeholder."
            exit 1
          fi
          echo "No hardcoded account IDs found."
